name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: fmt + clippy + tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  cross:
    name: cross-target check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add x86_64-pc-windows-gnu x86_64-apple-darwin x86_64-unknown-freebsd x86_64-unknown-netbsd
      - run: cargo check --target x86_64-pc-windows-gnu
      - run: cargo check --target x86_64-apple-darwin
      - run: cargo check --target x86_64-unknown-freebsd
      - run: cargo check --target x86_64-unknown-netbsd
