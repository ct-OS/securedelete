<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d7bff"/>
      <stop offset="1" stop-color="#1c48d4"/>
    </linearGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0a1a4d" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded tile -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="25.5" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>

  <!-- Document entering the shredder -->
  <path d="M40 20 h37 l15 15 v32 h-52 z" fill="#ffffff"/>
  <path d="M77 20 v15 h15 z" fill="#c9dbff"/>
  <rect x="48" y="38" width="30" height="4" rx="2" fill="#a9c2ff"/>
  <rect x="48" y="47" width="36" height="4" rx="2" fill="#a9c2ff"/>
  <rect x="48" y="56" width="24" height="4" rx="2" fill="#a9c2ff"/>

  <!-- Shredder -->
  <rect x="24" y="63" width="80" height="15" rx="7.5" fill="#0e1d52"/>
  <rect x="33" y="69.5" width="62" height="2.5" rx="1.25" fill="#ff5a3c"/>

  <!-- Shredded strips -->
  <rect x="41" y="81" width="6" height="26" rx="3" fill="url(#strip)"/>
  <rect x="51" y="81" width="6" height="19" rx="3" fill="url(#strip)"/>
  <rect x="61" y="81" width="6" height="29" rx="3" fill="url(#strip)"/>
  <rect x="71" y="81" width="6" height="17" rx="3" fill="url(#strip)"/>
  <rect x="81" y="81" width="6" height="24" rx="3" fill="url(#strip)"/>
</svg>
