[package]
name = "secure_delete"
version = "0.2.0"
edition = "2021"
description = "Securely delete files or storage devices using data overwriting"
license = "MIT"

[workspace]
members = [".", "gui"]
# The GUI needs Qt 6 + DTK; build it explicitly with `cargo build -p secure_delete_gui`.
default-members = ["."]

[dependencies]
clap = { version = "4", features = ["derive"] }
rand = "0.9"
indicatif = "0.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
] }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd", target_os = "dragonfly"))'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
